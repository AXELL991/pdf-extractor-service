# pdf-extractor-service — docker-compose individual (desarrollo standalone)
# Ejecutar desde este directorio:  docker compose up --build -d
# No tiene dependencias externas.

services:
  pdf-extractor-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-extractor-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOGLEVEL: info
      MAX_FILE_SIZE_MB: "15"
      MAX_PAGES: "500"
      EXTRACT_TIMEOUT_SECONDS: "25"
      INTERNAL_API_TOKEN: "change-me-in-production"
      WORKER_POOL_SIZE: "1"
      QUEUE_MAXSIZE: "100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s